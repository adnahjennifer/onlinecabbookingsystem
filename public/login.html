<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabGo | Passenger Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>CabGo</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html" data-nav="guest">Login</a>
        <a href="register.html" data-nav="guest">Register</a>
        <a href="passenger-dashboard.html" data-nav="auth">Dashboard</a>
        <a href="#" id="navLogout" data-nav="auth">Logout</a>
    </nav>
</header>

<main class="container">
    <section class="card form-card">
        <h2>Passenger Login</h2>

        <p>Enter your details to continue.</p>

        <form id="loginForm" novalidate>
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
                aria-describedby="emailError"
            >
            <span class="field-error" id="emailError" aria-live="polite"></span>

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                    aria-describedby="passwordError"
                >
                <button
                    type="button"
                    class="password-toggle-btn"
                    aria-label="Show password"
                    data-toggle="password"
                >Show</button>
            </div>
            <span class="field-error" id="passwordError" aria-live="polite"></span>

            <button class="button" type="submit">Login</button>
        </form>

        <div id="formMessage" class="message" role="status" aria-live="polite" hidden></div>

        <p>
            New passenger?
            <a href="register.html">Create an account</a>
        </p>

        <div class="demo-credentials-card" style="margin-top: 14px; padding: 10px 14px; background: #eaf2f8; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; color: #334e68; text-align: center;">
            Demo Login: <strong>alex@example.com</strong> &bull; Password: <strong>Password123</strong>
        </div>
    </section>
</main>

<footer>
    Online Cab Booking System
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
