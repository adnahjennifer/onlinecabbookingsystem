<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabGo | Passenger Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>CabGo</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html" data-nav="guest">Login</a>
        <a href="register.html" data-nav="guest">Register</a>
        <a href="passenger-dashboard.html" data-nav="auth">Dashboard</a>
        <a href="#" id="navLogout" data-nav="auth">Logout</a>
    </nav>
</header>

<main class="container">
    <section class="card form-card">
        <h2>Create Passenger Account</h2>

        <form id="registerForm" novalidate>
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
                aria-describedby="nameError"
            >
            <span class="field-error" id="nameError" aria-live="polite"></span>

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
                aria-describedby="emailError"
            >
            <span class="field-error" id="emailError" aria-live="polite"></span>

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    required
                    aria-describedby="passwordError"
                >
                <button
                    type="button"
                    class="password-toggle-btn"
                    aria-label="Show password"
                    data-toggle="password"
                >Show</button>
            </div>
            <span class="field-error" id="passwordError" aria-live="polite"></span>

            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrapper">
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                    aria-describedby="confirmPasswordError"
                >
                <button
                    type="button"
                    class="password-toggle-btn"
                    aria-label="Show password"
                    data-toggle="confirmPassword"
                >Show</button>
            </div>
            <span class="field-error" id="confirmPasswordError" aria-live="polite"></span>

            <button class="button" type="submit">Register</button>
        </form>

        <div id="formMessage" class="message" role="status" aria-live="polite" hidden></div>

        <p>
            Already registered?
            <a href="login.html">Login here</a>
        </p>
    </section>
</main>

<footer>
    Online Cab Booking System
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
